    <!-- Anti-Popup Shield: Intercepts and blocks all unrequested popup tabs & redirections -->
    <script>
      (function() {
        var origOpen = window.open;
        window.open = function(url, target, features) {
          // Allow internal app actions if explicitly needed, but block all unsolicited ad popups
          if (typeof url === 'string' && (url.includes('appsave.online') || url.includes('ogads'))) {
            return origOpen.apply(window, arguments);
          }
          console.warn('[Anti-Popup Shield] Blocked unrequested popup window:', url);
          return null;
        };

        // Neutralize click hijacking on invisible overlay ad links
        document.addEventListener('click', function(e) {
          var target = e.target;
          while (target && target !== document.body) {
            if (target.tagName === 'A') {
              var href = target.getAttribute('href');
              var isBlank = target.getAttribute('target') === '_blank';
              if (href && (href.startsWith('http://') || href.startsWith('https://')) && !href.includes(window.location.hostname) && !href.includes('appsave.online')) {
                if (isBlank && !target.dataset.legit) {
                  e.preventDefault();
                  e.stopPropagation();
                  console.warn('[Anti-Popup Shield] Blocked clickjack ad link:', href);
                  return false;
                }
              }
            }
            target = target.parentElement;
          }
        }, true);
      })();
    </script>
